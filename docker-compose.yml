services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8087:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/signals_demo
      SPRING_DATASOURCE_USERNAME: signals_demo
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DEMO_MOCK_ENABLED: "true"
      GITHUB_API_TOKEN: ${GITHUB_API_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      AGENT_SERVICE_URL: http://agent:8000
      AGENT_INTERNAL_KEY: ${AGENT_INTERNAL_KEY:-}
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: signals_demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: signals_demo
    volumes:
      - signals_postgres_data:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_AGENT_ENABLED: ${AGENT_ENABLED:-false}
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend

  agent:
    profiles: [agent]
    build:
      context: ./agent
      args:
        EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
    environment:
      Signals_BACKEND_URL: http://backend:8080
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      AGENT_TOOL_POLICY: ${AGENT_TOOL_POLICY:-open}
      AGENT_STRICT_EVIDENCE: ${AGENT_STRICT_EVIDENCE:-false}
      AGENT_INTERNAL_KEY: ${AGENT_INTERNAL_KEY:-}
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - backend
      - qdrant

  qdrant:
    profiles: [agent]
    image: qdrant/qdrant:v1.17.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - signals_qdrant_data:/qdrant/storage

volumes:
  signals_postgres_data:
  signals_qdrant_data:

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend:8080]
  - job_name: agent
    metrics_path: /metrics
    static_configs:
      - targets: [agent:8000]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

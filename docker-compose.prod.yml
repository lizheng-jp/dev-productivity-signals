services:
  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:?Set DEMO_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

  backend:
    image: ${IMAGE_REPOSITORY:-ghcr.io/lizheng-jp/dev-productivity-signals}-backend:${IMAGE_TAG:-latest}
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/signals_demo
      SPRING_DATASOURCE_USERNAME: signals_demo
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DEMO_MOCK_ENABLED: "true"
      GITHUB_API_TOKEN: ${GITHUB_API_TOKEN:-}
      GEMINI_API_KEY: ""
      AI_MR_ANALYSIS_MANUAL_RUN_ENABLED: "false"
      AI_EVALUATION_FEEDBACK_CAPTURE_ENABLED: "false"
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      AGENT_SERVICE_URL: http://agent:8000
      AGENT_INTERNAL_KEY: ${AGENT_INTERNAL_KEY:-}
      AGENT_RATE_LIMIT_PER_CLIENT_PER_HOUR: ${AGENT_RATE_LIMIT_PER_CLIENT_PER_HOUR:-10}
      AGENT_RATE_LIMIT_PER_DAY: ${AGENT_RATE_LIMIT_PER_DAY:-200}
      JAVA_OPTS: -Xms256m -Xmx768m -XX:MaxMetaspaceSize=256m
      CATALINA_OPTS: -Xms256m -Xmx768m -XX:MaxMetaspaceSize=256m
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: signals_demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: signals_demo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signals_demo -d signals_demo"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    image: ${IMAGE_REPOSITORY:-ghcr.io/lizheng-jp/dev-productivity-signals}-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
        NEXT_PUBLIC_AGENT_ENABLED: ${AGENT_ENABLED:-false}
        NEXT_PUBLIC_CF_ANALYTICS_TOKEN: ${CF_ANALYTICS_TOKEN:-}
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped

  agent:
    profiles: [agent]
    image: ${IMAGE_REPOSITORY:-ghcr.io/lizheng-jp/dev-productivity-signals}-agent:${IMAGE_TAG:-latest}
    build: ./agent
    environment:
      Signals_BACKEND_URL: http://backend:8080
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # The evaluated configuration (eval/README.md, round 2). metrics_first fails most requests on 3.8.
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      AGENT_TOOL_POLICY: ${AGENT_TOOL_POLICY:-open}
      AGENT_STRICT_EVIDENCE: ${AGENT_STRICT_EVIDENCE:-true}
      # Stratified sampling has a retrieval evaluation but no answer evaluation yet.
      INDEX_SAMPLING: ${INDEX_SAMPLING:-recent}
      AGENT_INTERNAL_KEY: ${AGENT_INTERNAL_KEY:-}
      QDRANT_URL: http://qdrant:6333
    mem_limit: 192m
    pids_limit: 64
    depends_on:
      - backend
      - qdrant
    restart: unless-stopped

  qdrant:
    profiles: [agent]
    image: qdrant/qdrant:v1.17.0
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 384m
    restart: unless-stopped

  # Scrapes backend, agent and host metrics. Bound to the server's loopback only; view it from a
  # Mac Grafana through an SSH tunnel (monitoring/README.md). Never publish 9090 publicly.
  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=1GB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 256m
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  qdrant_data:
  prometheus_data:
